<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temps de trajet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef;
    --surface: #fcfcfb;
    --border: #e4e2dc;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #8a8984;
    --grid: #ebe9e4;
    --typique: #2a78d6;
    --reel: #eb6834;
    --tab-active: #0b0b0b;
    --tab-active-text: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110;
      --surface: #1a1a19;
      --border: #2c2c2a;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #8a8984;
      --grid: #2a2a28;
      --typique: #3987e5;
      --reel: #d95926;
      --tab-active: #f0efec;
      --tab-active-text: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2c2c2a; --text: #f0efec; --text-2: #c3c2b7;
    --muted: #8a8984; --grid: #2a2a28; --typique: #3987e5; --reel: #d95926;
    --tab-active: #f0efec; --tab-active-text: #1a1a19;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-2); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 28px 0 16px; }
  .tabs button {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2);
  }
  .tabs button[aria-pressed="true"] { background: var(--tab-active); color: var(--tab-active-text); border-color: var(--tab-active); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .tile .label { font-size: 13px; color: var(--text-2); }
  .tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 13px; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: 8px 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 16px; height: 0; border-top: 2px solid; }
  .swatch.dash { border-top-style: dashed; }

  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 170px;
    box-shadow: 0 6px 20px rgb(0 0 0 / 0.12); opacity: 0; transition: opacity .1s;
  }
  .tooltip strong { display: block; margin-bottom: 4px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-2); }
  .tooltip .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 500; color: var(--text-2); font-size: 13px; }
  td.empty { color: var(--muted); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 14px; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    main { padding-top: 24px; }
    .tiles { grid-template-columns: 1fr; }
    .card { padding: 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Temps de trajet A → B</h1>
    <p id="sous-titre">Départs de 7h00 à 8h00, en voiture</p>
  </header>

  <div class="tabs" role="group" aria-label="Jour" id="tabs"></div>

  <div class="tiles">
    <div class="tile"><div class="label">Meilleur départ (typique)</div><div class="value" id="t-best">–</div><div class="sub" id="t-best-sub"></div></div>
    <div class="tile"><div class="label">Partir à 8h00 plutôt qu'à 7h00</div><div class="value" id="t-delta">–</div><div class="sub">en temps typique</div></div>
    <div class="tile"><div class="label">Réel vs typique (moyenne)</div><div class="value" id="t-reel">–</div><div class="sub" id="t-reel-sub"></div></div>
  </div>

  <section class="card">
    <h2>Durée du trajet selon l'heure de départ</h2>
    <div class="legend">
      <span><i class="swatch" style="border-color:var(--typique)"></i>Typique (historique TomTom)</span>
      <span><i class="swatch" style="border-color:var(--reel)"></i>Réel mesuré (moyenne)</span>
      <span><i class="swatch dash" style="border-color:var(--muted)"></i>Sans trafic</span>
    </div>
    <div class="chart" id="chart">
      <svg id="svg" role="img" aria-label="Durée du trajet selon l'heure de départ"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <details>
      <summary>Voir les données</summary>
      <table id="table"></table>
    </details>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi"];
const CRENEAUX = ["07:00", "07:10", "07:20", "07:30", "07:40", "07:50", "08:00"];
const heure = c => c.replace(/^0/, "").replace(":", "h");
const fmt = v => v == null ? "–" : v.toFixed(1).replace(".", ",");
const fmtMin = v => v == null ? "–" : `${Math.round(v)} min`;
const signe = v => (v >= 0 ? "+" : "−") + fmt(Math.abs(v));
const moyenne = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const arrivee = (creneau, minutes) => {
  const [h, m] = creneau.split(":").map(Number);
  const t = h * 60 + m + Math.round(minutes);
  return `${Math.floor(t / 60)}h${String(t % 60).padStart(2, "0")}`;
};

let donnees, mesures = [], jourActif = "semaine";

async function charger() {
  donnees = await (await fetch("typiques.json", { cache: "no-store" })).json();
  try {
    const r = await fetch("mesures.csv", { cache: "no-store" });
    if (r.ok) {
      const [entete, ...lignes] = (await r.text()).trim().split("\n");
      const cols = entete.split(",");
      mesures = lignes.map(l => Object.fromEntries(l.split(",").map((v, i) => [cols[i], v])));
    }
  } catch (e) { /* pas encore de mesures */ }

  document.getElementById("sous-titre").textContent =
    `Départs de 7h00 à 8h00, en voiture · ${fmt(donnees.distance_km)} km`;
  const jours = [...new Set(mesures.map(m => m.date))];
  document.getElementById("footer").textContent =
    `Typique : historique du trafic TomTom (calculé le ${donnees.genere_le}). ` + (mesures.length
      ? `Réel : ${mesures.length} mesure${mesures.length > 1 ? "s" : ""} sur ${jours.length} jour${jours.length > 1 ? "s" : ""}.`
      : "Réel : pas encore de mesures, les premières arrivent le prochain jour ouvré à 7h.");

  const tabs = document.getElementById("tabs");
  for (const j of ["semaine", ...JOURS]) {
    const b = document.createElement("button");
    b.textContent = j === "semaine" ? "Moyenne semaine" : j[0].toUpperCase() + j.slice(1);
    b.onclick = () => { jourActif = j; rendre(); };
    b.dataset.jour = j;
    tabs.appendChild(b);
  }
  const auj = JOURS[(new Date().getDay() + 6) % 7];
  if (auj) jourActif = auj;
  rendre();
  let largeur = innerWidth;
  addEventListener("resize", () => { if (innerWidth !== largeur) { largeur = innerWidth; rendre(); } });
}

function serie(jour) {
  const jours = jour === "semaine" ? JOURS : [jour];
  return CRENEAUX.map(c => {
    const typ = moyenne(jours.map(j => donnees.typiques[j]?.[c]).filter(v => v != null));
    const reels = mesures.filter(m => jours.includes(m.jour) && m.creneau === c).map(m => +m.reel_min);
    return { creneau: c, typique: typ, reel: moyenne(reels), n: reels.length };
  });
}

function rendre() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.jour === jourActif));
  const pts = serie(jourActif);

  const best = pts.reduce((a, b) => b.typique < a.typique ? b : a);
  document.getElementById("t-best").textContent = heure(best.creneau);
  document.getElementById("t-best-sub").textContent = `${fmtMin(best.typique)} · arrivée ${arrivee(best.creneau, best.typique)}`;
  document.getElementById("t-delta").textContent = `${signe(pts.at(-1).typique - pts[0].typique)} min`;
  const avecReel = pts.filter(p => p.reel != null);
  if (avecReel.length) {
    const d = moyenne(avecReel.map(p => p.reel - p.typique));
    document.getElementById("t-reel").textContent = `${signe(d)} min`;
    document.getElementById("t-reel-sub").textContent = d > 0 ? "plus lent que d'habitude" : "plus rapide que d'habitude";
  } else {
    document.getElementById("t-reel").textContent = "–";
    document.getElementById("t-reel-sub").textContent = "pas encore de mesures";
  }

  dessiner(pts);
  tableau(pts);
}

function dessiner(pts) {
  const svg = document.getElementById("svg");
  const W = Math.max(320, Math.round(svg.parentElement.clientWidth)), H = W < 600 ? 260 : 340;
  const m = { t: 28, r: W < 600 ? 14 : 20, b: 36, l: 40 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const etroit = W < 600;
  const valeurs = pts.flatMap(p => [p.typique, p.reel]).filter(v => v != null).concat(donnees.sans_trafic_min);
  const yMin = Math.floor(Math.min(...valeurs) / 5) * 5, yMax = Math.ceil(Math.max(...valeurs) / 5) * 5;
  const x = i => m.l + i * (W - m.l - m.r) / (CRENEAUX.length - 1);
  const y = v => m.t + (yMax - v) * (H - m.t - m.b) / (yMax - yMin);
  const ligne = (cle) => {
    let d = "", debut = true;
    pts.forEach((p, i) => {
      if (p[cle] == null) { debut = true; return; }
      d += `${debut ? "M" : "L"}${x(i)},${y(p[cle])}`; debut = false;
    });
    return d;
  };

  let s = `<g class="axis">`;
  for (let v = yMin; v <= yMax; v += 5) {
    s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text x="${m.l - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  CRENEAUX.forEach((c, i) => {
    if (etroit && i % 2) return;
    s += `<text x="${x(i)}" y="${H - 10}" text-anchor="${i === 0 ? "start" : i === 6 ? "end" : "middle"}">${heure(c)}</text>`;
  });
  s += `<text x="${m.l - 10}" y="${m.t - 14}" text-anchor="end">min</text></g>`;

  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(donnees.sans_trafic_min)}" y2="${y(donnees.sans_trafic_min)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s += `<path d="${ligne("typique")}" fill="none" stroke="var(--typique)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<path d="${ligne("reel")}" fill="none" stroke="var(--reel)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    s += `<circle cx="${x(i)}" cy="${y(p.typique)}" r="4.5" fill="var(--typique)" stroke="var(--surface)" stroke-width="2"/>`;
    if (p.reel != null) s += `<circle cx="${x(i)}" cy="${y(p.reel)}" r="4.5" fill="var(--reel)" stroke="var(--surface)" stroke-width="2"/>`;
  });

  s += `<line id="cross" class="crosshair" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>`;
  const pas = (W - m.l - m.r) / (CRENEAUX.length - 1);
  pts.forEach((_, i) => s += `<rect data-i="${i}" x="${x(i) - pas / 2}" y="0" width="${pas}" height="${H}" fill="transparent"/>`);

  svg.innerHTML = s;

  const tip = document.getElementById("tooltip"), cross = svg.querySelector("#cross");
  svg.querySelectorAll("rect[data-i]").forEach(r => {
    r.addEventListener("pointerenter", () => {
      const i = +r.dataset.i, p = pts[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      tip.innerHTML = `<strong>Départ ${heure(p.creneau)}</strong>
        <div class="row"><span><i style="background:var(--typique)"></i>Typique</span><b>${fmt(p.typique)} min</b></div>
        <div class="row"><span><i style="background:var(--reel)"></i>Réel${p.n ? ` (${p.n})` : ""}</span><b>${p.reel == null ? "–" : fmt(p.reel) + " min"}</b></div>
        <div class="row"><span>Arrivée typique</span><b>${arrivee(p.creneau, p.typique)}</b></div>`;
      const box = svg.getBoundingClientRect(), px = x(i) / W * box.width;
      tip.style.left = `${Math.min(Math.max(px - 85, 0), box.width - 180)}px`;
      tip.style.top = `${y(Math.max(p.typique, p.reel ?? 0)) / H * box.height - 110}px`;
      tip.style.opacity = 1;
    });
  });
  svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; cross.setAttribute("visibility", "hidden"); });
}

function tableau(pts) {
  let t = `<thead><tr><th>Départ</th><th>Typique</th><th>Réel</th><th>Écart</th><th>Arrivée typique</th></tr></thead><tbody>`;
  for (const p of pts) {
    const e = p.reel == null ? null : p.reel - p.typique;
    t += `<tr><td>${heure(p.creneau)}</td><td>${fmt(p.typique)}</td>
      <td class="${p.reel == null ? "empty" : ""}">${fmt(p.reel)}</td>
      <td class="${e == null ? "empty" : ""}">${e == null ? "–" : signe(e)}</td>
      <td>${arrivee(p.creneau, p.typique)}</td></tr>`;
  }
  document.getElementById("table").innerHTML = t + "</tbody>";
}

charger();
</script>
</body>
</html>
