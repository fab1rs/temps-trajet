name: Mise à jour des temps typiques

on:
  schedule:
    - cron: "0 3 1 * *"  # le 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typiques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Temps typiques
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          ORIGINE: ${{ secrets.ORIGINE }}
          DESTINATION: ${{ secrets.DESTINATION }}
        run: python typiques.py

      - name: Sauvegarde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add typiques.json
          git diff --staged --quiet || (git commit -m "Temps typiques du $(TZ=Europe/Paris date +%F)" && git pull --rebase && git push)
