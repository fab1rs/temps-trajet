name: Mesure temps de trajet

on:
  schedule:
    # Les crons GitHub sont en UTC : un déclenchement par saison, 15 min avant chaque plage
    # (6h45 pour l'aller, 17h45 pour le retour, heure de Paris).
    # Le script ignore celui qui ne correspond pas à la saison en cours.
    - cron: "45 4 * * 1-6"   # aller, heure d'été (UTC+2)
    - cron: "45 5 * * 1-6"   # aller, heure d'hiver (UTC+1)
    - cron: "45 15 * * 1-6"  # retour, heure d'été (UTC+2)
    - cron: "45 16 * * 1-6"  # retour, heure d'hiver (UTC+1)
  workflow_dispatch:  # lancement manuel = une mesure immédiate dans chaque sens, pour tester

permissions:
  contents: write

concurrency:
  group: mesure
  cancel-in-progress: false

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mesures
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          ORIGINE: ${{ secrets.ORIGINE }}
          DESTINATION: ${{ secrets.DESTINATION }}
        run: |
          case "${{ github.event.schedule }}" in
            "45 4 * * 1-6")  python trajet.py --sens aller --session 2 ;;
            "45 5 * * 1-6")  python trajet.py --sens aller --session 1 ;;
            "45 15 * * 1-6") python trajet.py --sens retour --session 2 ;;
            "45 16 * * 1-6") python trajet.py --sens retour --session 1 ;;
            *)               python trajet.py --sens aller --maintenant && python trajet.py --sens retour --maintenant ;;
          esac

      - name: Rapport et sauvegarde
        if: always()
        run: |
          python rapport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A mesures.csv RAPPORT.md 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Mesures du $(TZ=Europe/Paris date +%F)" && git pull --rebase && git push)
